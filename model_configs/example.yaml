# Example configuration file for training and evaluating a PBI model.
# You can use this file as a template to create your own configuration files.
# Remember to only use one of the multiple options provided for some parameters
# (i.e. no repeated keys, only the last one is considered by YAML parsers).

# ---------------------------------------------------------------------------
# Input data
# ---------------------------------------------------------------------------

input_perphect: path/to/perphect/data
# Basic shorthand: /path/to/perphect/data must contain bacteria_df.csv,
# phages_df.csv and couples_df.csv.

input_perphect: # More explicit form, specify each file individually.
  bacteria_df: /path/to/perphect/data/bacteria_df.csv # Columns: 'bacterium_id', 'bacterium_sequence'
  phages_df: /path/to/perphect/data/phages_df.csv     # Columns: 'phage_id', 'phage_sequence'
  couples_df: /path/to/perphect/data/couples_df.csv   # Columns: 'bacterium_id', 'phage_id', 'interaction_type'

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------

embeddings_dir: data/embeddings   # Where embeddings are stored/loaded. Default: 'data/embeddings'.
output_dir: output/example_model/ # Where results are saved. Set to null to skip saving.

# ---------------------------------------------------------------------------
# Hardware
# ---------------------------------------------------------------------------

num_gpu: 0          # 1 = use GPU, 0 = CPU only. Default: 0.
gpu_id: 0           # GPU index when num_gpu=1.
torch_num_threads: -1 # PyTorch thread count. -1 = let PyTorch decide. Default: -1.

# ---------------------------------------------------------------------------
# Training configuration
# ---------------------------------------------------------------------------

training_config:
  do_train: true  # If false, only compute embeddings and exit. Default: true.
  do_test: true   # If false, train on the full dataset and skip evaluation. Default: true.

  epochs: 10          # Training epochs. Default: 10.
  learning_rate: 1e-3 # Adam learning rate. Default: 1e-3.
  weight_decay: 1e-4  # Adam L2 regularisation. Default: 1e-4.
  batch_size: 128     # Batch size (train & test). Default: 128.

  training_noise_std: 0.05
  # Gaussian noise added to embeddings during training for regularisation.
  # Set to 0 to disable. Default: 0.05.

  # -------------------------------------------------------------------------
  # Learning rate scheduling
  # -------------------------------------------------------------------------

  lr_schedule: plateau
  # LR scheduler to use. Options:
  #   "plateau": ReduceLROnPlateau: reduces LR when validation metric stops
  #              improving. Requires k_folds_cv >= 2 (needs a validation set).
  #   "cosine":  CosineAnnealingLR: decays LR from learning_rate to 1e-6
  #              over `epochs` steps. Works without a validation set.
  #   "none":    No LR scheduling.
  # Default:     "plateau".

  patience_reduce_lr: 1000           # Epochs without improvement before LR is reduced ("plateau" only). Default: 1000.
  monitor_metric_reduce_lr: f1       # Metric to watch: "f1" or "loss" ("plateau" only). Default: "f1".
  multiplying_factor_reduce_lr: 0.5  # LR reduction factor ("plateau" only). Default: 0.5.

  # -------------------------------------------------------------------------
  # Early stopping
  # -------------------------------------------------------------------------

  patience_early_stopping: 1000         # Epochs without improvement before stopping. Default: 1000.
  monitor_metric_early_stopping: f1     # Metric to watch: "f1" or "loss". Default: "f1".

  # -------------------------------------------------------------------------
  # Dimensionality reduction
  # -------------------------------------------------------------------------

  reduce_dimensionality: "none"
  # Technique applied to merged embeddings before training. Options: "none", "PCA".
  # Default: "none".
  n_components_bacteria: null # PCA components for bacteria. null = keep all. Default: null.
  n_components_phages: null   # PCA components for phages. null = keep all. Default: null.

  # -------------------------------------------------------------------------
  # Cross-validation
  # -------------------------------------------------------------------------

  k_folds_cv: 3      # K-fold CV folds. Must be >= 2. Set to 1 for no CV. Default: 3.
  stratify_cv: false
  # If true, each fold holds out an exclusive subset of phage IDs (ensures
  # the validation set contains only unseen phages). Default: false.

  # -------------------------------------------------------------------------
  # Test set configuration
  # -------------------------------------------------------------------------

  test_split_strategy: random
  # How to create the test set when do_test=true and test_dataset_path is not set.
  # Options:
  #   "random":    random shuffle split (uses test_size). Default.
  #   "phage":     hold out n_holdout_test random phage IDs.
  #   "bacteria":  hold out n_holdout_test random bacteria IDs.

  test_size: 0.2          # Test fraction when test_split_strategy="random". Default: 0.2.
  n_holdout_test: null    # Organism IDs to hold out when strategy is "phage"/"bacteria". Default: null.

  test_dataset_path: null
  # Path to a separate CSV test file (e.g. predphi_test_dataset.csv).
  # When set, test_split_strategy is ignored and this file is used directly.
  # The PCA (if enabled) is fitted on the training set and applied to this file.
  # Default: null (use split strategy).

# ---------------------------------------------------------------------------
# Phage embedding models
# ---------------------------------------------------------------------------

phages_embedding_models:
  # List of models to embed phage sequences. Multiple models have their
  # embeddings concatenated into one final embedding.
  #
  # Fields per model:
  #   name (str): Class name in pbi_models.embedders (e.g. NT2, MegaDNA, DNABERT2).
  #   params (dict): Constructor kwargs for the model.
  #   strategy (str | dict): Merging strategy for multiple sub-embeddings per sequence.
  #     String shorthand (default params):  strategy: TruncateStrategy
  #     Explicit form:
  #       strategy:
  #         name: TKPertStrategy
  #         params: {J: 16, gamma: 20, merging_strategy: concat}
  #   use_cached_embeddings: auto | true | false
  #     true:   always load from cache, never recompute (model is not loaded).
  #     false:  always recompute, overwrite cache.
  #     auto:   load from cache if available, otherwise compute and cache.

  - name: NT2
    params:
      model_name: nucleotide-transformer-v2-250m-multi-species
    strategy: TopBottomTruncateStrategy
    use_cached_embeddings: auto

  - name: MegaDNA
    params:
      weights_path: data/weights/megaDNA_phage_145M.pt # Auto-downloaded if omitted.
      get_layer: concat
    strategy: MaxStrategy
    use_cached_embeddings: auto

  - name: DNABERT2
    params:
      source_code_path: DNABERT-2-117M/
      max_seq_len: 32768
    strategy:
      name: TKPertStrategy
      params:
        J: 16
        gamma: 20
        merging_strategy: concat
    use_cached_embeddings: auto

# ---------------------------------------------------------------------------
# Bacteria embedding models
# ---------------------------------------------------------------------------

bacteria_embedding_models:
  # Same format as phages_embedding_models.

  - name: NT2
    params:
      model_name: nucleotide-transformer-v2-250m-multi-species
    strategy: TopBottomTruncateStrategy
    use_cached_embeddings: true

  - name: MegaDNA
    params:
      weights_path: data/weights/megaDNA_phage_145M.pt
      get_layer: concat
    strategy: BottomTruncateStrategy
    use_cached_embeddings: true

  - name: DNABERT2
    params:
      source_code_path: DNABERT-2-117M/
      max_seq_len: 32768
    strategy: TopBottomTruncateStrategy
    use_cached_embeddings: true

# ---------------------------------------------------------------------------
# K-mer frequency features (Optional)
# ---------------------------------------------------------------------------

# Optional k-mer frequency features. Skips PCA. (default: null).
kmer_features:
  k_values: [3, 4] # List of k-mer lengths to compute relative frequencies for (e.g. [3, 4, 5]).

# ---------------------------------------------------------------------------
# Classifier
# ---------------------------------------------------------------------------

# Fields:
#   name (str): Class name in pbi_models.classifiers.
#   params (dict): Constructor kwargs (excluding bacterium_embed_dim / phage_embed_dim / kmer_dim,
#                  which are inferred automatically from the embedding and k-mer dimensions).

# Example: two-branch MLP (plus optional k-mer branch):
classifier:
  name: MLPClassifier
  params:
    bacterium_mlp_sizes: [64]
    phage_mlp_sizes: [128, 64]
    kmer_mlp_sizes: [64]  # Optional dedicated branch for k-mer features when kmer_features is set
    dense_dim: 100
    dropout: 0.2

# Example: single-branch MLP:
classifier:
  name: BasicMLPClassifier
  params:
    mlp_params: [256, 128]
    dropout: 0.4

# Example: linear classifier (no params):
classifier:
  name: LinearClassifier

# Example: sklearn / LightGBM / XGBoost:
classifier:
  name: SklearnClassifier
  params:
    sklearn_model_name: RandomForestClassifier
    sklearn_model_params:
      n_estimators: 200
      n_jobs: -1

classifier:
  name: SklearnClassifier
  params:
    sklearn_model_name: LGBMClassifier
    sklearn_model_params:
      num_leaves: 63
      n_estimators: 1000
      max_bin: 512
      force_col_wise: true
      n_jobs: -1